<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0F172A" />
    <title>Offline — Prime Fitness</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #f1f5f9;
        font: 16px/1.6 system-ui;
      }
      main {
        padding: 2rem;
        max-width: 28rem;
        text-align: center;
      }
      a {
        display: inline-block;
        padding: 1rem;
        color: #d4af37;
        border: 1px solid #d4af37;
        border-radius: 1rem;
      }
      p {
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Your workout logs stay saved on this device. Reopen training to keep logging; other pages
        need a connection.
      </p>
      <a href="./train">Open saved workout</a>
      <p lang="ar" dir="rtl">
        أنت غير متصل. تبقى مجموعات التمرين محفوظة على هذا الجهاز. افتح التدريب للمتابعة.
      </p>
    </main>
  </body>
</html>
