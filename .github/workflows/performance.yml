name: Performance regression checks

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TZ: Africa/Cairo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run test:performance
      - run: npm run test:training:performance
      - run: cp .env.ci.example .env
      - run: npx playwright install --with-deps chrome
      - run: npm run build
      - name: Compare sync request counts with committed baseline
        run: npm run test:e2e -- --grep "sync request traffic benchmark" --reporter=line,html
        env:
          PW_SYNC_TRAFFIC: after
      - name: Upload performance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-evidence
          path: |
            docs/performance/local-verification.json
            artifacts/sync-traffic-after.json
            playwright-report/
            test-results/
          retention-days: 14
